name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好的建议请说明「解决什么问题」，而不只是「加一个按钮」。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你在什么场景下觉得不方便？现在的替代做法是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 你期望的交互或实现方式。若有参考产品，可以描述其做法而非直接贴链接。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 推荐算法 / 审美评分
        - 衣橱与录入
        - 日历与统计
        - 版型识别 / 视觉
        - 本地 / 云端专家
        - 界面与主题
        - 构建、测试或文档
        - 其他
    validations:
      required: true